name: Compile RMX2020 Kernel (via build.sh)

on:
  workflow_dispatch:

jobs:
  Kernel_CI:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SWAP
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev libdw-dev build-essential lz4 git python3 curl dwarves cpio gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b sixteen-qpr2 https://github.com/sarthakroy2002/kernel_realme_RMX2020.git kernel_source

      - name: Fix and Execute build.sh
        run: |
          cd kernel_source
          
          # 1. Setup KernelSU & SUSFS BEFORE building
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
          curl -Lo susfs.patch https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/Patch/susfs_patch_to_4.14.patch
          patch -p1 < susfs.patch
          
          # 2. Add KSU configs to defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/RMX2020_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/RMX2020_defconfig

          # 3. Patch build.sh to use a working Clang download link
          # The original link in build.sh usually fails in CI
          sed -i 's|wget https://android.googlesource.com.*-O "aosp-clang.tar.gz"|curl -L https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r50/clang-r510928.tar.gz -o aosp-clang.tar.gz|' build.sh
          
          # 4. Run the script
          chmod +x build.sh
          ./build.sh

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: RMX2020-Kernel-KSU
          # Your build.sh places the zip inside the 'AnyKernel' folder
          path: kernel_source/AnyKernel/*.zip
